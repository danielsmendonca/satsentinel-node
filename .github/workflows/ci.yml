name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # o contrato file:./protocol precisa do dist compilado antes do build raiz
      - run: npm ci --no-audit --no-fund --prefix protocol
      - run: npm run build --prefix protocol
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm test
